# Type-check, lint and test both projects; build the web app.
#
# The committed backend/dist and frontend/dist (the server deploys with
# `git pull`, see docs/deploy-checklist.md) are neither required nor checked:
# the frontend build below writes only into this runner's checkout.
name: CI

on:
  push:
    branches: [main, 'phases-*']
  pull_request:
    branches: [main, 'phases-*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # mongodb-memory-server downloads a mongod binary on install (and on
      # first use); tests need no MongoDB or Redis service (ioredis-mock).
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npx vitest run

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
